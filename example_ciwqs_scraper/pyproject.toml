[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciwqs-scraper"
version = "0.1.0"
description = "Scraper for California Integrated Water Quality System (CIWQS)"
authors = [
    {name = "Varun Magesh", email = "varun@stanford.edu"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "rich>=10.0.0",
    "shapely>=1.7.0",
    "sqlalchemy>=1.4.0",
    "pandas>=1.3.0",
    "pathlib",
]