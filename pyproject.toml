[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wwtp-process-extraction"
version = "0.1.0"
description = "Extraction of wastewater treatment plant unit processes from NPDES permits"
authors = [
    {name = "WE3 Lab"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.0.0",
    "pandas>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.13.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.27.2.3",
    "openpyxl>=3.0.0",
    "xlrd>=2.0.1",
    "requests>=2.32.5",
    "beautifulsoup4>=4.12.0",
    "rdflib>=7.0.0",
    "jsonschema>=4.26.0",
    "geopy>=2.4.0"
]