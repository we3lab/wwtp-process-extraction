[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npdes-permits"
version = "0.1.0"
description = "NPDES permits data scraping and analysis tool"
authors = [
    {name = "NPDES Permits Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "PyPDF2>=3.0.0",
    "openpyxl>=3.0.0",
    "requests>=2.32.5",
    "xlrd>=2.0.1",
    "rdflib>=7.0.0",
]